name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the light install: parsers, labels and the api are tested without pytorch
      - run: pip install -r requirements-app.txt pytest
      - run: pytest
